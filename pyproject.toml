[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fontvault"
version = "1.0.0"
description = "Gestor de tipografías para Windows con copia de seguridad, descargas gratuitas, miniaturas y vista previa en vivo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "fonttools>=4.50",
    "Pillow>=10.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8.0",
]

[project.gui-scripts]
fontvault = "fontvault.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
